[project]
name = "dance-diffusion"
version = "0.1.0"
description = "Harmonai Dance Diffusion (sample-generator + v-diffusion-pytorch) setup (Windows, UV, CUDA 11.8)"
requires-python = "==3.11.*"
dependencies = [
    "sample-generator",
    "v-diffusion-pytorch",
    "torch",
    "torchvision",
    "torchaudio",
    "notebook",
    "matplotlib",
    "ipywidgets",
    "k-diffusion",
    "soundfile",
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
# Equivalent of: git clone https://github.com/harmonai-org/sample-generator && pip install .
sample-generator = { git = "https://github.com/harmonai-org/sample-generator", rev = "main" }

# Equivalent of: git clone --recursive https://github.com/crowsonkb/v-diffusion-pytorch && pip install -e .
v-diffusion-pytorch = { git = "https://github.com/crowsonkb/v-diffusion-pytorch", rev = "master" }

torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
