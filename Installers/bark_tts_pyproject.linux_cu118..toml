[project]
name = "bark-tts"
version = "0.1.0"
description = "Suno AI Bark text-to-speech setup (Linux, UV, CUDA)"
requires-python = "==3.13.*"
dependencies = [
    "suno-bark",
    "boto3",
    "encodec",
    "funcy",
    "numpy",
    "scipy",
    "tokenizers",
    "tqdm",
    "transformers",
    "torch",
    "torchvision",
    "torchaudio",
    "notebook",
    "ipywidgets",
    "matplotlib",
    "optimum",
    "soundfile",
    "hf_xet",
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
# Equivalent of: git clone https://github.com/suno-ai/bark && pip install .
# The repo's own pyproject.toml declares its package name as "suno-bark",
# even though you still `import bark` in Python.
suno-bark = { git = "https://github.com/suno-ai/bark", rev = "main" }

# cu118 matches the Windows/CUDA variant for consistency. If your Linux box has
# a recent NVIDIA driver, switching to cu121/cu124/cu128 (Astral/PyTorch docs)
# will generally give better performance than cu118 on modern GPUs.
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
