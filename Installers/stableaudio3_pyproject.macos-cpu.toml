[project]
name = "stable-audio-3"
version = "0.1.0"
description = "Stable Audio 3: open platform for generated audio and music"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "numpy>=2.2.6",
    "packaging>=26.0",
    "safetensors>=0.7.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "tqdm>=4.67.3",
    "huggingface-hub>=1.7.1",
    "transformers>=5.8.0",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "PyQt5",
    "pyqtgraph",
    "PyOpenGL",
]

[project.optional-dependencies]
ui = [
    "gradio==6.3.0",
    "matplotlib>=3.10.8",
    "accelerate>=1.13.0",
]

lora = [
    "pytorch_lightning==2.5.5",
    "dill>=0.4.1",
]

[project.scripts]
stable-audio = "stable_audio_3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "stable_audio_3/models",
    "stable_audio_3/inference",
    "stable_audio_3/interface",
    "stable_audio_3/data",
    "stable_audio_3/training",
    "optimized",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]