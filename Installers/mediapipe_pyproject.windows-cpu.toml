[project]
name = "mediapipe-toolbox"
version = "0.1.0"
description = "MediaPipe-based pose/hand/face tracking tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "protobuf",
    "absl-py",
    "scipy",
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "PyQt5-sip==12.17.0",
    "pyqtgraph",
    "PyOpenGL",
    "tensorflow",
    "mediapipe",
    "python-osc",
    "fbx",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
fbx = { path = "../../../../Installers/fbx-2020.3.11-cp312-none-win_amd64.whl" }