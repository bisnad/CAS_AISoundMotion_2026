[project]
name = "yolo"
version = "0.1.0"
description = "Ultralytics YOLO tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "opencv-python",
    "ultralytics",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pillow",
    "pyyaml",
    "PyQt5",
    "pyqtgraph",
    "PyOpenGL",
    "tensorboardX",
    "tqdm",
    "easydict",
    "prettytable",
    "chumpy-fix",
    "imageio-ffmpeg",
    "ipdb",
    "pytorch-metric-learning",
    "smplx",
    "roma",
    "python-osc",
    "fbx",
    "pip>=26.2.1",
    "setuptools>=84.0.0",
]
[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[tool.uv.sources]
fbx = { path = "../../../../Installers/fbx-2020.3.11-cp312-cp312-macosx_11_0_arm64.whl" }