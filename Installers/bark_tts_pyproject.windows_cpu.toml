[project]
name = "bark-tts"
version = "0.1.0"
description = "Suno AI Bark text-to-speech setup (Windows, UV, CPU-only)"
requires-python = "==3.13.*"
dependencies = [
    "suno-bark",
    "boto3",
    "encodec",
    "funcy",
    "numpy",
    "scipy",
    "tokenizers",
    "tqdm",
    "transformers",
    "torch",
    "torchvision",
    "torchaudio",
    "notebook",
    "ipywidgets",
    "matplotlib",
    "optimum",
    "soundfile",
    "hf_xet",
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
# Equivalent of: git clone https://github.com/suno-ai/bark && pip install .
# The repo's own pyproject.toml declares its package name as "suno-bark",
# even though you still `import bark` in Python.
suno-bark = { git = "https://github.com/suno-ai/bark", rev = "main" }

torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
