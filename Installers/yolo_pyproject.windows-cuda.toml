[project]
name = "yolo"
version = "0.1.0"
description = "Ultralytics YOLO tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "opencv-python",
    "ultralytics",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pillow",
    "pyyaml",
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "PyQt5-sip==12.17.0",
    "pyqtgraph",
    "PyOpenGL",
    "tensorboardX",
    "tqdm",
    "easydict",
    "prettytable",
    "chumpy-fix",
    "imageio-ffmpeg",
    "ipdb",
    "pytorch-metric-learning",
    "smplx",
    "roma",
    "python-osc",
    "fbx",
    "pip>=26.2.1",
    "setuptools>=84.0.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

fbx = { path = "../../../../Installers/fbx-2020.3.11-cp312-none-win_amd64.whl" }