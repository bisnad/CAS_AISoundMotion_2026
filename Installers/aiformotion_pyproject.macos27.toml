[project]
name = "ai-motion"
version = "0.1.0"
description = "Motion analysis, autoencoder, and clustering scripts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "diffusers==0.40.0",
    "transformers>=5.8.0",
    "scipy>=1.16",
    "scikit-learn==1.5.2",
    "matplotlib>=3.10.8",
    "pandas",
    "transforms3d",
    "PyQt5",
    "pyqtgraph",
    "PyOpenGL",
    "vispy",
    "jupyterlab",
    "python-osc",
    "ipywidgets"
]
