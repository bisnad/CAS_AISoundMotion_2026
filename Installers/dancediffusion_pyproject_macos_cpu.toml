[project]
name = "dance-diffusion"
version = "0.1.0"
description = "Harmonai Dance Diffusion (sample-generator + v-diffusion-pytorch) setup (macOS, UV, MPS/CPU)"
requires-python = "==3.11.*"
dependencies = [
    "sample-generator",
    "v-diffusion-pytorch",
    "torch",
    "torchvision",
    "torchaudio",
    "notebook",
    "matplotlib",
    "ipywidgets",
    "k-diffusion",
    "soundfile",
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
# Equivalent of: git clone https://github.com/harmonai-org/sample-generator && pip install .
sample-generator = { git = "https://github.com/harmonai-org/sample-generator", rev = "main" }

# Equivalent of: git clone --recursive https://github.com/crowsonkb/v-diffusion-pytorch && pip install -e .
v-diffusion-pytorch = { git = "https://github.com/crowsonkb/v-diffusion-pytorch", rev = "master" }

# No custom index needed on macOS: PyPI's default torch wheels for macOS
# already include Apple Silicon MPS (GPU) acceleration. There is no separate
# "CUDA build" for macOS since NVIDIA CUDA does not run on Apple hardware.
# The Dance Diffusion notebook already checks for `torch.backends.mps.is_available()`
# and falls back to CPU otherwise, so no code changes are needed here either.

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
