[project]
name = "mediapipe-toolbox"
version = "0.1.0"
description = "MediaPipe-based pose/hand/face tracking tools"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "protobuf",
    "absl-py",
    "scipy",
    "PyQt5",
    "pyqtgraph",
    "PyOpenGL",
    "tensorflow",
    "mediapipe",
    "python-osc",
    "fbx",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
fbx = { path = "../../../../Installers/fbx-2020.3.7-cp310-cp310-macosx_10_15_universal2.whl" }